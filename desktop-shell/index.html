<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>史学研究工作台正在启动</title>
  <style>
    body{margin:0;min-height:100vh;color:#312b27;background:#eee7dc;font-family:"Microsoft YaHei",sans-serif}
    [hidden]{display:none!important}
    main{position:fixed;inset:0;display:grid;place-content:center;padding:40px;background:#eee7dc}
    .startup-card{width:min(520px,80vw);padding:40px;border:1px solid #c8b8a5;border-radius:18px;background:#fffaf3;box-shadow:0 18px 50px #3b302625}
    h1{margin:0 0 12px;font:600 26px Georgia,"Songti SC",serif}p{line-height:1.7;color:#6c6259}.bar{height:5px;overflow:hidden;border-radius:4px;background:#e5d8c7}.bar::after{content:"";display:block;width:40%;height:100%;background:#9a5e3d;animation:move 1.2s infinite ease-in-out}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eee7dc}
  </style>
</head>
<body>
  <iframe id="workbench" title="史学研究工作台" hidden></iframe>
  <main id="startup"><section class="startup-card"><h1>史学研究工作台</h1><p id="status">正在启动本地研究服务，并打开你的工作区……</p><div class="bar"></div></section></main>
  <script src="desktop.js"></script>
</body>
</html>
