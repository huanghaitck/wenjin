[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-research-workbench"
version = "0.1.0"
description = "Wenjin: a local-first, model-selectable humanities and social science research workbench"
requires-python = ">=3.13"
dependencies = ["certifi>=2025.1,<2027", "PyMuPDF>=1.26,<2", "python-docx>=1.2,<2"]

[project.optional-dependencies]
desktop = ["pyinstaller>=6.21,<7"]

[project.scripts]
hrw = "research_workbench.cli:main"
wenjin = "research_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_workbench = ["web_assets/*.html", "web_assets/*.js", "web_assets/*.css", "builtin_skills/*/SKILL.md"]
