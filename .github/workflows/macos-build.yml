name: macOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.21,<7"
          npm ci
          chmod +x node_modules/agent-browser/bin/agent-browser-darwin-arm64
      - name: Test desktop packaging core
        run: python -m unittest tests/test_d5.py -q
      - name: Build Python sidecar
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name hrw-sidecar --paths src \
            --collect-data research_workbench --collect-data certifi --collect-all pymupdf \
            --collect-all openai_codex --collect-all codex_cli_bin \
            --distpath build/sidecar-dist --workpath build/sidecar-work --specpath build \
            scripts/desktop_sidecar.py
          mkdir -p src-tauri/binaries
          cp build/sidecar-dist/hrw-sidecar src-tauri/binaries/hrw-sidecar-aarch64-apple-darwin
          chmod +x src-tauri/binaries/hrw-sidecar-aarch64-apple-darwin
          python scripts/smoke_desktop_sidecar.py src-tauri/binaries/hrw-sidecar-aarch64-apple-darwin
      - name: Build ad-hoc signed app and DMG
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg
      - name: Upload unsigned test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wenjin-0.1.4-macos-arm64-unsigned-test
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
