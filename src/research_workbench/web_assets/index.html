<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>史学研究工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>史学 Research Codex</strong><span>M5 · 研究图书馆、版本与人工门禁</span></div>
    <div class="importer">
      <button id="libraryMode" class="mode-active">研究图书馆</button>
      <button id="agentMode">研究对话</button>
      <button id="sourceMode">文献修复</button>
      <input id="pdfFile" type="file" accept="application/pdf">
      <button id="importButton">导入 PDF</button>
      <select id="sourceSelect" aria-label="选择文献"></select>
    </div>
  </header>

  <div id="notice" role="status">正在读取本地项目……</div>
  <main id="libraryWorkbench" class="library-workbench">
    <aside class="inventory-panel surface">
      <header class="agent-heading"><div><h2>只读盘点</h2><p id="libraryRoot">正在读取图书馆位置……</p></div></header>
      <div class="inventory-form">
        <label>材料所在文件夹<input id="scanRoot" placeholder="例如 D:\History\Books"></label>
        <label>验收 Skill<select id="intakeSkill"></select></label>
        <button id="scanLibrary" class="primary-inline">只读盘点，先不入库</button>
        <p class="boundary-note">仅查看你填写的目录；不会移动、改名或修改原文件。</p>
      </div>
      <div id="scanSummary" class="scan-summary"></div>
      <div id="scanCandidates" class="scan-candidates"></div>
      <button id="approveCandidates" class="primary library-approve" hidden>批准所选材料原地入库</button>
    </aside>

    <section class="catalog-panel surface">
      <header class="agent-heading">
        <div><h1>研究图书馆</h1><p id="libraryCounts">作品、文件与精确版本分层保存</p></div>
        <div class="library-search"><input id="libraryQuery" placeholder="题名、作者、出版社、标签或前段文本"><button id="searchLibrary">检索</button></div>
      </header>
      <div id="workList" class="work-list"></div>
    </section>

    <aside class="work-detail-panel surface">
      <header class="agent-heading"><div><h2>作品与版本</h2><p>哈希只标识精确文件版本</p></div></header>
      <div id="workDetail" class="work-detail"></div>
    </aside>
  </main>

  <main id="agentWorkbench" class="agent-workbench" hidden>
    <aside class="thread-panel surface">
      <header class="agent-heading"><h2>研究线程</h2><button id="newThread">＋</button></header>
      <div id="threadList" class="thread-list"></div>
    </aside>

    <section class="conversation-panel surface">
      <header class="agent-heading">
        <div><h1 id="threadTitle">新建一个研究线程</h1><p id="runState">对话与运行状态会保存在本地项目中</p></div>
        <label>主模型<select id="modelProfile"></select></label>
      </header>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="例如：查看当前来源和异常，并把结论保存为研究札记"></textarea>
        <button id="sendMessage" class="primary-inline">发送</button>
      </div>
    </section>

    <aside class="activity-panel surface">
      <header class="agent-heading"><div><h2>运行与审批</h2><p>工具结果不是自动认可的研究判断</p></div></header>
      <div id="approvalPanel"></div>
      <div id="runTimeline" class="run-timeline"></div>
    </aside>
  </main>

  <main id="pdfWorkbench" class="workbench" hidden>
    <aside class="page-panel surface">
      <h2>物理页</h2>
      <div id="pageRail" class="page-rail"></div>
    </aside>

    <section class="source-panel surface">
      <header class="panel-heading">
        <div><h1 id="sourceTitle">尚未导入文献</h1><p id="pageLabel">原 PDF 页面始终是校对依据</p></div>
        <div class="zoom-controls"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button></div>
      </header>
      <div class="page-canvas"><img id="pageImage" alt="当前 PDF 原页"></div>
    </section>

    <section class="repair-panel surface">
      <header class="panel-heading"><div><h2>提取文本</h2><p id="sourceState">等待材料</p></div></header>
      <div class="review-fields">
        <label>复核人<input id="reviewer" value="human-reviewer"></label>
        <label>修正依据<input id="reason" placeholder="例如：逐字核对当前原页"></label>
      </div>
      <section class="model-assist">
        <div class="model-heading">
          <div><h2>模型修复建议</h2><p id="ocrCapability">正在检查视觉模型……</p></div>
          <button id="ocrPropose" hidden>生成当前页建议</button>
        </div>
        <div id="ocrProposal"></div>
      </section>
      <div id="blocks" class="blocks"></div>
      <button id="pageRepair" class="primary" hidden>提交整页修正</button>
      <section class="anomaly-section"><h2>待复核项</h2><div id="anomalies"></div></section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
